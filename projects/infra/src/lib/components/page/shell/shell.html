<ng-content select="ims-top-bar"></ng-content>
<ng-content select="ims-insured-header"></ng-content>

<div class="main-area">
  <lib-tabs class="steps-tabs">
    @for (tab of processStore.stepsVm().steps; track tab.name) {
      <lib-tab [value]="tab.name" [disabled]="!tab.isEnabled">
        <ng-template libTabLabel>{{ tab.label }}</ng-template>
        <div *libTabContent>
          <pre>
            <code>
            {{processStore.stepsVm() | json}}
            </code>
          </pre>
        </div>
      </lib-tab>
    }
  </lib-tabs>
  <lib-tabs class="info-tabs" secondary>
    @for (tab of processStore.infosVm().infos; track tab.id) {
      <lib-tab [value]="tab.id" [disabled]="!tab.isEnabled">
        <ng-template libTabLabel>{{ tab.label }}</ng-template>
        <div *libTabContent>
          <pre>
            <code>
            {{processStore.infosVm() | json}}
            </code>
          </pre>
        </div>
      </lib-tab>
    }
  </lib-tabs>
</div>
