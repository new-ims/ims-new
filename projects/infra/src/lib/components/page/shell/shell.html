<ng-content select="ims-top-bar"></ng-content>
<ng-content select="ims-insured-header"></ng-content>

<div class="main-area">
  <lib-tabs>
    <lib-tab value="first">
      <ng-template libTabLabel>פרטי התביעה</ng-template>
      <div *libTabContent>פה יופיע תוכן פרטי התביעה</div>
    </lib-tab>
    <lib-tab value="second" [disabled]="true">
      <ng-template libTabLabel>מסמכים / מכתבים</ng-template>
      <div *libTabContent>פה יופיע תוכן מסמכים / מכתבים</div>
    </lib-tab>
    <lib-tab value="third">
      <ng-template libTabLabel>בקשות המבוטח</ng-template>
      <div *libTabContent>פה יופיע תוכן בקשות המבוטח</div>
    </lib-tab>
    <lib-tab value="fourth">
      <ng-template libTabLabel>פוליסות</ng-template>
      <div *libTabContent>פה יופיע תוכן פוליסות</div>
    </lib-tab>
    <lib-tab value="fifth">
      <ng-template libTabLabel>החלטה</ng-template>
      <div *libTabContent>פה יופיע תוכן החלטה</div>
    </lib-tab>
    <lib-tab value="sixth">
      <ng-template libTabLabel>תשלומים</ng-template>
      <div *libTabContent>פה יופיע תוכן תשלומים</div>
    </lib-tab>
  </lib-tabs>
</div>
