<div ngTabs>
  <div ngTabList>
    @for (tab of tabs(); track $index) {
      <div ngTab [value]="tab.value()">
        <ng-container *ngTemplateOutlet="tab.labelDirective()!.template!" />
      </div>
    }
  </div>
  <div class="tab-content">
    @for (tab of tabs(); track $index) {
      <div ngTabPanel [value]="tab.value()">
        <ng-template ngTabContent>
          <ng-container *ngTemplateOutlet="tab.contentDirective()!.template!" />
        </ng-template>
      </div>
    }
  </div>
</div>
